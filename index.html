<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Netflix Account Manager</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="top-nav">
    <div class="nav-container">
      <div class="brand">
        <h1>Netflix Manager</h1>
        <p class="subtitle">Slot & Renewal Tracker</p>
      </div>
      <button class="btn btn-primary btn-add-acc" onclick="window.openModal('accountModal')">+ Add Account</button>
    </div>
  </header>

  <main class="main-content">
    <!-- Live Stats Bar -->
    <section class="stats-bar">
      <div class="stat-pill">
        <span class="stat-label">Total Accounts:</span>
        <strong id="statTotalAccounts" class="stat-value">0</strong>
      </div>
      <div class="stat-pill">
        <span class="stat-label">Total Slots:</span>
        <strong id="statTotalSlots" class="stat-value">0 / 0</strong>
      </div>
    </section>

    <!-- Search & Category Dropdown Bar -->
    <section class="controls-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search customer, profile, email..." />
      </div>
      <div class="filter-dropdown-box">
        <select id="categoryFilter" class="form-select filter-select">
          <option value="all">📁 All Categories</option>
          <option value="priority">⭐ Priority</option>
          <option value="blacklist">🚫 Blacklist</option>
          <option value="soon">⚠️ Expiring Soon (≤3d)</option>
          <option value="expired">❌ Expired</option>
          <option value="warranty">🛡️ Warranty Active</option>
        </select>
      </div>
    </section>

    <div id="accountsContainer" class="accounts-grid">
      <p class="loading-text">Loading accounts...</p>
    </div>
  </main>

  <!-- Modal: Add Netflix Account -->
  <div class="modal" id="accountModal">
    <div class="modal-card">
      <h3>Add Netflix Account</h3>
      <form id="accountForm">
        <div class="form-group">
          <label for="accountEmail">Netflix Master Email</label>
          <input type="email" id="accountEmail" required placeholder="netflix-email@gmail.com" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="window.closeModal('accountModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Account</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add / Edit Profile -->
  <div class="modal" id="profileModal">
    <div class="modal-card">
      <h3 id="profileModalTitle">Add Customer Profile</h3>
      <form id="profileForm">
        <input type="hidden" id="profileId" />
        <input type="hidden" id="profileAccountId" />

        <div class="form-group">
          <label for="customerName">Customer Name</label>
          <input type="text" id="customerName" required placeholder="e.g. Sarah" />
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label for="profileName">Profile Name</label>
            <input type="text" id="profileName" required placeholder="e.g. Slot 1" />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="profilePin">PIN</label>
            <input type="text" id="profilePin" maxlength="8" placeholder="1206" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label for="expiryDate">Expiry Date</label>
            <input type="date" id="expiryDate" required />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="profileTag">Customer Tag</label>
            <select id="profileTag" class="form-select">
              <option value="none">Normal (None)</option>
              <option value="priority">⭐ Priority (3+ Months)</option>
              <option value="blacklist">🚫 Blacklist</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="profileNotes">Notes / Catatan</label>
          <input type="text" id="profileNotes" placeholder="e.g. Ig: @sarah / Remarks" />
        </div>

        <div class="form-group-checkbox">
          <input type="checkbox" id="hasWarranty" />
          <label for="hasWarranty">Warranty Verified (Screenshot received)</label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="window.closeModal('profileModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
