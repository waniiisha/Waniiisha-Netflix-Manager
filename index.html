<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Account Manager</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="top-nav">
    <div class="nav-container">
      <div class="brand">
        <h1>Netflix Manager</h1>
        <p class="subtitle">Slot & Renewal Tracker</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="btnOpenNewAccountModal">+ Add Account</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- Filter & Search Controls -->
    <section class="controls-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by customer, email, or profile..." />
      </div>
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="soon">Expiring Soon (≤3d)</button>
        <button class="filter-btn" data-filter="expired">Expired</button>
        <button class="filter-btn" data-filter="warranty">Warranty Active</button>
      </div>
    </section>

    <!-- Accounts Container -->
    <div id="accountsContainer" class="accounts-grid">
      <p class="loading-text">Loading accounts...</p>
    </div>
  </main>

  <!-- Modal: Add / Edit Account -->
  <div class="modal" id="accountModal">
    <div class="modal-card">
      <h3 id="accountModalTitle">Add Netflix Account</h3>
      <form id="accountForm">
        <div class="form-group">
          <label for="accountEmail">Netflix Master Email</label>
          <input type="email" id="accountEmail" required placeholder="example@netflix.com" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('accountModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Account</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add / Edit Profile -->
  <div class="modal" id="profileModal">
    <div class="modal-card">
      <h3 id="profileModalTitle">Add Customer Profile</h3>
      <form id="profileForm">
        <input type="hidden" id="profileId" />
        <input type="hidden" id="profileAccountId" />

        <div class="form-group">
          <label for="customerName">Customer Name</label>
          <input type="text" id="customerName" required placeholder="e.g. Sarah" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="profileName">Profile Name</label>
            <input type="text" id="profileName" required placeholder="e.g. Slot 1" />
          </div>
          <div class="form-group">
            <label for="profilePin">PIN (Optional)</label>
            <input type="text" id="profilePin" maxlength="6" placeholder="1234" />
          </div>
        </div>

        <div class="form-group">
          <label for="expiryDate">Expiry Date</label>
          <input type="date" id="expiryDate" required />
        </div>

        <div class="form-group-checkbox">
          <input type="checkbox" id="hasWarranty" />
          <label for="hasWarranty">Warranty Verified (Screenshot received within 24h)</label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('profileModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
